<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification | Wikimind Food API</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="app">
        <header class="wm-header">
            <div class="wm-container">
                <div class="wm-logo">WIKIMIND <span class="wm-logo-sub">FOOD API</span></div>
                <nav class="wm-nav">
                    <a href="index.html" class="wm-nav-item">Accueil</a>
                    <a href="docs.html" class="wm-nav-item">Documentation</a>
                    <a href="test-api.html" class="wm-nav-item">Tester l'API</a>
                </nav>
            </div>
        </header>

        <main class="wm-auth-page">
            <div class="wm-auth-container">
                <div class="wm-auth-card">
                    <div class="wm-auth-tabs">
                        <button class="wm-auth-tab active" data-tab="login">Se connecter</button>
                        <button class="wm-auth-tab" data-tab="register">S'inscrire</button>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm" class="wm-auth-form active" data-form="login">
                        <h2 class="wm-auth-title">Se connecter</h2>

                        <div class="wm-form-group">
                            <label for="loginEmail">Adresse e-mail</label>
                            <input type="email" id="loginEmail" class="wm-input" placeholder="votre@email.com" required>
                        </div>

                        <div class="wm-form-group">
                            <label for="loginPassword">Mot de passe</label>
                            <div class="wm-input-wrapper">
                                <input type="password" id="loginPassword" class="wm-input" placeholder="••••••••" required>
                                <button type="button" class="wm-input-icon" onclick="togglePassword('loginPassword')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                        <path d="M2 12s3-5 10-5 10 5 10 5-3 5-10 5-10-5-10-5z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="wm-form-actions">
                            <button type="submit" class="wm-btn wm-btn-primary wm-btn-full" id="loginBtn">
                                <span class="wm-btn-text">Se connecter</span>
                                <span class="wm-btn-loader" style="display: none;"></span>
                            </button>
                        </div>

                        <div class="wm-form-footer">
                            <a href="#" class="wm-link">Mot de passe oublié ?</a>
                        </div>

                        <div class="wm-divider">
                            <span>ou</span>
                        </div>

                        <div class="wm-social-auth">
                            <button type="button" class="wm-social-btn" onclick="signInWithGoogle()">
                                <svg width="18" height="18" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Continuer avec Google
                            </button>
                        </div>
                    </form>

                    <!-- Register Form -->
                    <form id="registerForm" class="wm-auth-form" data-form="register">
                        <h2 class="wm-auth-title">Créer un compte</h2>

                        <div class="wm-form-group">
                            <label for="registerName">Nom complet</label>
                            <input type="text" id="registerName" class="wm-input" placeholder="Jean Dupont" required>
                        </div>

                        <div class="wm-form-group">
                            <label for="registerEmail">Adresse e-mail</label>
                            <input type="email" id="registerEmail" class="wm-input" placeholder="votre@email.com" required>
                        </div>

                        <div class="wm-form-group">
                            <label for="registerPassword">Mot de passe</label>
                            <div class="wm-input-wrapper">
                                <input type="password" id="registerPassword" class="wm-input" placeholder="••••••••" required minlength="8">
                                <button type="button" class="wm-input-icon" onclick="togglePassword('registerPassword')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                        <path d="M2 12s3-5 10-5 10 5 10 5-3 5-10 5-10-5-10-5z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="wm-input-hint">Minimum 8 caractères</div>
                        </div>

                        <div class="wm-form-group">
                            <label for="registerConfirmPassword">Confirmer le mot de passe</label>
                            <div class="wm-input-wrapper">
                                <input type="password" id="registerConfirmPassword" class="wm-input" placeholder="••••••••" required>
                                <button type="button" class="wm-input-icon" onclick="togglePassword('registerConfirmPassword')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                                        <path d="M2 12s3-5 10-5 10 5 10 5-3 5-10 5-10-5-10-5z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="wm-form-group">
                            <div class="wm-checkbox">
                                <input type="checkbox" id="registerTerms" required>
                                <label for="registerTerms">
                                    J'accepte les <a href="#" class="wm-link">Conditions d'utilisation</a> et la <a href="#" class="wm-link">Politique de confidentialité</a>
                                </label>
                            </div>
                        </div>

                        <div class="wm-form-actions">
                            <button type="submit" class="wm-btn wm-btn-primary wm-btn-full" id="registerBtn">
                                <span class="wm-btn-text">Créer un compte</span>
                                <span class="wm-btn-loader" style="display: none;"></span>
                            </button>
                        </div>

                        <div class="wm-divider">
                            <span>ou</span>
                        </div>

                        <div class="wm-social-auth">
                            <button type="button" class="wm-social-btn" onclick="signInWithGoogle()">
                                <svg width="18" height="18" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                Continuer avec Google
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/app.js"></script>
    <script>   // Dans auth.js, modifier onAuthStateChanged
onAuthStateChanged(auth, (user) => {
    currentUser = user;
    updateAuthUI(user);

    // Rediriger vers la page demandée après connexion
    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get('redirect');
    if (user && redirect) {
        window.location.href = redirect;
    }

    if (user) {
        saveUserToDatabase(user);
    }
});
    </script>
</body>
</html>
